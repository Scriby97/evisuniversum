# Bei jedem Push: Typen, Lint und die automatischen Tests (Warenkorb, Bestellung, Anfrage, Barrierefreiheit).
# Läuft mit festen Testdaten, nicht mit Evis Inhalten aus Sanity. Das Deployment bei Cloudflare ist davon unabhängig.
name: Tests

on:
  push:
    paths: ["web/**", "studio/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  # Schema oder Abfragen geändert, aber `npm run typegen` (studio/) vergessen? Dann schlägt dieser Job fehl.
  typegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typegen
      - name: Erzeugte Typen sind aktuell
        run: git diff --exit-code -- schema.json ../web/src/sanity.types.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Next erzeugt Routen-Typen (LayoutProps, next-env.d.ts) sonst erst beim Build
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
